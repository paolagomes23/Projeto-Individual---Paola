<!DOCTYPE html>

<head>

  <link rel="stylesheet" href="../css/quiz-partes.css">

<body onload="iniciarPagina()">

  <div class="container">

    <div class="lateral">

      <div class="logo">
        <img src="../assets/imgs/logo branca.png">
      </div>

      <div class="menu">
        <a class="botao" href="dash-inicio.html">
          <img src="../assets/imgs/inicio.png">
          <span>Dashboard</span>
        </a>

        <a class="botao" href="quiz-teoria.html">
          <img src="../assets/imgs/jogo-branco.png">
          <span>Quiz - Teoria Musical</span>
        </a>

        <a class="botao" href="quiz-pratica.html">
          <img src="../assets/imgs/jogo-branco.png">

        <a class="botao" href="quiz-historia.html">
          <img src="../assets/imgs/jogo-branco.png">

          <img src="../assets/imgs/jogo-branco.png">

        <a class="botao sair" href="../index.html">
          <img src="../assets/imgs/sair.png">
          <span>Sair</span>
        </a>
      </div>
    </div>

    <div class="meio">

      <div id="pontuacaoEJogo">

        <div id="inicioquiz" class="quiz">
          <h1>Quiz - Partes do Violino</h1>
          <p>Clique abaixo para iniciar</p>
          <button id="btnIniciarQuiz" onclick="iniciarQuiz()">Iniciar</button>
        </div>

        <div id="pontuacao" class="flex-colunar width-fit-content border-primary">
          <div id="pontuacaoDuranteJogo" class="flex-colunar padding-8">
            <span class="width-fit-content"><span id="spanCertas"></span></span>
            <span class="width-fit-content"> <span id="spanErradas"></span></span>
          </div>

          <div id="pontuacaoFinalJogo" class="box-final">
            <h2>Pontuação Final</h2>
            <span id="spanPontuacaoFinal"></span>
            <p id="msgFinal"></p>
            <button onclick="tentarNovamente()" id="btnTentarNovamente" class="botao-final">Tentar novamente</button>
          </div>
        </div>

        <div id="jogo" class="width-fit-content flex-colunar border-secondary">

          <div id="infoQuestao" class="padding-8">
            <span>Questão atual: <span id="spanNumeroDaQuestaoAtual"></span> de <span id="qtdQuestoes"></span>
              questões.</span>
          </div>

          <div id="perguntaDaQuestaoAtual" class="padding-8">
            <span id="spanQuestaoExibida" class="text-bold"></span>
          </div>

          <div id="opcoes" class="flex-colunar padding-8">
            <span>
              <input type="radio" id="primeiraOpcao" name="option" class="radio" value="alternativaA"
                onclick="responder()" />
              <label for="primeiraOpcao" class="option" id="labelOpcaoUm"></label>
            </span>
            <span>
              <input type="radio" id="segundaOpcao" name="option" class="radio" value="alternativaB"
                onclick="responder()" />
              <label for="segundaOpcao" class="option" id="labelOpcaoDois"></label>
            </span>
            <span>
              <input type="radio" id="terceiraOpcao" name="option" class="radio" value="alternativaC"
                onclick="responder()" />
              <label for="terceiraOpcao" class="option" id="labelOpcaoTres"></label>
            </span>
            <span>
              <input type="radio" id="quartaOpcao" name="option" class="radio" value="alternativaD"
                onclick="responder()" />
              <label for="quartaOpcao" class="option" id="labelOpcaoQuatro"></label>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
<script>
  let listaDeQuestoes = [
  {
    "pergunta": "Qual é a principal função do arco no violino?",
    "alternativaA": "Modificar a afinação das cordas",
    "alternativaB": "Produzir som ao friccionar as cordas",
    "alternativaC": "Sustentar o corpo do violino",
    "alternativaD": "Controlar o volume do instrumento",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "Como as cordas do violino ficam posicionadas?",
    "alternativaA": "Fixadas apenas no espelho",
    "alternativaB": "Presas dentro do instrumento",
    "alternativaC": "Esticadas entre estandarte e cravelhal",
    "alternativaD": "Ligadas somente ao cavalete",
    "alternativaCorreta": "alternativaC"
  },
  {
    "pergunta": "Qual parte do violino serve de apoio para o queixo?",
    "alternativaA": "Espelho do instrumento",
    "alternativaB": "Queixeira do violino",
    "alternativaC": "Tampo de ressonância",
    "alternativaD": "Estandarte inferior",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "O espelho do violino é a parte onde:",
    "alternativaA": "O arco realiza a vibração",
    "alternativaB": "Os dedos pressionam as cordas",
    "alternativaC": "O som é amplificado internamente",
    "alternativaD": "As cravelhas ficam encaixadas",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "Qual componente auxilia na afinação das cordas?",
    "alternativaA": "Cavalete de madeira",
    "alternativaB": "Queixeira anatômica",
    "alternativaC": "Cravelhas superiores",
    "alternativaD": "Tampo ressonante",
    "alternativaCorreta": "alternativaC"
  },
  {
    "pergunta": "Onde as cravelhas do violino estão localizadas?",
    "alternativaA": "Na base do instrumento",
    "alternativaB": "Na lateral do cavalete",
    "alternativaC": "Na região do cravelhal",
    "alternativaD": "Na extremidade do arco",
    "alternativaCorreta": "alternativaC"
  },
  {
    "pergunta": "Qual é a função do cavalete no violino?",
    "alternativaA": "Segurar o arco durante a execução",
    "alternativaB": "Transmitir vibrações das cordas",
    "alternativaC": "Regular a tensão da crina",
    "alternativaD": "Sustentar a queixeira inferior",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "O tampo do violino corresponde à:",
    "alternativaA": "Parte frontal do instrumento",
    "alternativaB": "Região traseira do corpo",
    "alternativaC": "Estrutura lateral curva",
    "alternativaD": "Base inferior do braço",
    "alternativaCorreta": "alternativaA"
  },
  {
    "pergunta": "Qual nome recebe a parte traseira do violino?",
    "alternativaA": "Fundo do instrumento",
    "alternativaB": "Espelho harmônico",
    "alternativaC": "Queixeira acústica",
    "alternativaD": "Cavalete central",
    "alternativaCorreta": "alternativaA"
  },
  {
    "pergunta": "O estandarte do violino é responsável por:",
    "alternativaA": "Sustentar as cravelhas superiores",
    "alternativaB": "Prender as cordas na base",
    "alternativaC": "Apoiar o braço do músico",
    "alternativaD": "Produzir ressonância sonora",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "Qual parte conecta o corpo ao cravelhal?",
    "alternativaA": "Braço do violino",
    "alternativaB": "Tampo ressonante",
    "alternativaC": "Queixeira inferior",
    "alternativaD": "Fundo acústico",
    "alternativaCorreta": "alternativaA"
  },
  {
    "pergunta": "Qual é a função da alma do violino?",
    "alternativaA": "Decorar a estrutura interna",
    "alternativaB": "Controlar a afinação das cordas",
    "alternativaC": "Transmitir vibrações sonoras internas",
    "alternativaD": "Sustentar o estandarte inferior",
    "alternativaCorreta": "alternativaC"
  },
  {
    "pergunta": "Onde a alma do violino está localizada?",
    "alternativaA": "Na superfície externa frontal",
    "alternativaB": "No interior do instrumento",

  {

    "alternativaA": "Melhorar o acabamento visual",
    "alternativaB": "Apoiar o encaixe do arco",

  },
  {

    "alternativaA": "Cravelhas de afinação",

    "alternativaD": "Braço de sustentação",

  },
  {
    "pergunta": "O arco do violino é normalmente fabricado com:",
    "alternativaA": "Metal e fibras sintéticas",
    "alternativaB": "Madeira e crina de cavalo",
    "alternativaC": "Vidro e materiais plásticos",
    "alternativaD": "Borracha e aço leve",

  {
    "pergunta": "Qual parte do arco entra em contato com as cordas?",
    "alternativaA": "Madeira da haste",
    "alternativaB": "Ponta de sustentação",
    "alternativaC": "Crina do arco",
    "alternativaD": "Parafuso traseiro",
    "alternativaCorreta": "alternativaC"
  },
  {
    "pergunta": "Para que serve o parafuso localizado no arco?",
    "alternativaA": "Modificar a afinação do violino",
    "alternativaB": "Ajustar a tensão da crina",
    "alternativaC": "Prender o arco ao cavalete",
    "alternativaD": "Produzir vibração nas cordas",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "Qual é a principal função do braço do violino?",
    "alternativaA": "Sustentar o encaixe do arco",
    "alternativaB": "Posicionar a mão esquerda",
    "alternativaC": "Controlar a projeção sonora",
    "alternativaD": "Transmitir vibrações internas",
    "alternativaCorreta": "alternativaB"
  },
  {
    "pergunta": "Qual dessas peças não faz parte do violino?",
    "alternativaA": "Cavalete de madeira",
    "alternativaB": "Espelho de execução",
    "alternativaC": "Pedal de sustentação",
    "alternativaD": "Cravelhas superiores",
    "alternativaCorreta": "alternativaC"
  }
];

  let numeroDaQuestaoAtual = 0
  let pontuacaoFinal = 0
  let tentativaIncorreta = 0
  let certas = 0
  let erradas = 0
  let quantidadeDeQuestoes = listaDeQuestoes.length


  function iniciarPagina() {
    onloadEsconder();
    buscarPerguntas();
  }

  function onloadEsconder() {
    document.getElementById('pontuacao').style.display = "none"
    document.getElementById('jogo').style.display = "none"
    document.getElementById('btnTentarNovamente').style.display = "none"
    document.getElementById('pontuacaoFinalJogo').style.display = "none"
  }

  function iniciarQuiz() {
    document.getElementById('jogo').style.display = "flex"
    document.getElementById('btnIniciarQuiz').style.display = "none"
    document.getElementById('inicioquiz').style.display = "none"
    document.getElementById('qtdQuestoes').innerHTML = quantidadeDeQuestoes
    document.getElementById('pontuacao').style.display = "flex"

    preencherHTMLcomQuestaoAtual(0)
  }


  function preencherHTMLcomQuestaoAtual(index) {
    habilitarAlternativas(true)

    const questaoAtual = listaDeQuestoes[index]
    numeroDaQuestaoAtual = index

    console.log("questaoAtual")
    console.log(questaoAtual)

    document.getElementById("spanNumeroDaQuestaoAtual").innerHTML = Number(index) + 1 // ajustando porque o index começa em 0
    document.getElementById("spanQuestaoExibida").innerHTML = questaoAtual.pergunta;
    document.getElementById("labelOpcaoUm").innerHTML = questaoAtual.alternativaA;
    document.getElementById("labelOpcaoDois").innerHTML = questaoAtual.alternativaB;
    document.getElementById("labelOpcaoTres").innerHTML = questaoAtual.alternativaC;
    document.getElementById("labelOpcaoQuatro").innerHTML = questaoAtual.alternativaD;
  }


  function habilitarAlternativas(trueOrFalse) {
    let opcaoEscolhida = trueOrFalse ? false : true

    primeiraOpcao.disabled = opcaoEscolhida
    segundaOpcao.disabled = opcaoEscolhida
    terceiraOpcao.disabled = opcaoEscolhida
    quartaOpcao.disabled = opcaoEscolhida
  }


  function checarResposta() {
    const questaoAtual = listaDeQuestoes[numeroDaQuestaoAtual] // questão atual 
    const respostaQuestaoAtual = questaoAtual.alternativaCorreta // qual é a resposta correta da questão atual
    const options = document.getElementsByName("option"); // recupera alternativas no html

    let alternativaCorreta = null

    options.forEach((option) => {
      if (option.value === respostaQuestaoAtual) {
        console.log("alternativaCorreta está no componente: " + alternativaCorreta)
        alternativaCorreta = option.labels[0].id
      }
    })

    // verifica se resposta assinalada é correta
    options.forEach((option) => {
      if (option.checked === true && option.value === respostaQuestaoAtual) {

        document.getElementById(alternativaCorreta)
          .classList.add("text-success-with-bg")

        pontuacaoFinal++
        certas++
        numeroDaQuestaoAtual++

      } else if (option.checked && option.value !== respostaQuestaoAtual) {

        const wrongLabelId = option.labels[0].id

        document.getElementById(wrongLabelId)
          .classList.add("text-danger-with-bg")

        document.getElementById(alternativaCorreta)
          .classList.add("text-success-with-bg")

        tentativaIncorreta++
        erradas++
        numeroDaQuestaoAtual++
      }
    })
  };


  function responder() {
    habilitarAlternativas(false)
    checarResposta()

    setTimeout(() => {
      avancar()
    }, 1000)
  }


  function limparCoresBackgroundOpcoes() {
    const options = document.getElementsByName("option");
    options.forEach((option) => {
      document.getElementById(option.labels[0].id).classList.remove("text-danger-with-bg")
      document.getElementById(option.labels[0].id).classList.remove("text-success-with-bg")
    })
  }


  function desmarcarRadioButtons() {
    const options = document.getElementsByName("option");
    for (let i = 0; i < options.length; i++) {
      options[i].checked = false;
    }
  }


  function avancar() {
    desmarcarRadioButtons()
    limparCoresBackgroundOpcoes()

    if (numeroDaQuestaoAtual < quantidadeDeQuestoes) {
      preencherHTMLcomQuestaoAtual(numeroDaQuestaoAtual)
    } else {
      finalizarJogo()
    }
  }


  function finalizarJogo() {

    console.log(sessionStorage.ID_USUARIO);
    console.log(pontuacaoFinal);

    fetch("/quiz/salvarTentativa", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({
        fkUsuario: sessionStorage.ID_USUARIO,
        fkQuiz: 4,
        pontuacao: pontuacaoFinal
      })
    })
      .then(function (resposta) {
        console.log("Resultado salvo!");
      });


    document.getElementById('jogo').style.display = "none"
    document.getElementById('pontuacaoFinalJogo').style.display = "flex"
    document.getElementById('spanPontuacaoFinal').innerHTML = pontuacaoFinal
    document.getElementById('btnTentarNovamente').style.display = "flex"
  }


  function tentarNovamente() {
    window.location.reload()
  }

</script>
