<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Violino | Arco e Cordas</title>

    <link rel="stylesheet" href="cadastro.css">

</head>

<body>

    <div class="containerSuperior">
    <ul class="indices">
        <a href="inicio.html" class="botao1"><img src="sair.png"> EXIT</a> 
    </ul> 
    </div>
    
    <div class="container">
        <div class="cadastro"><img src="logo.png" alt="">
            <h2>CADASTRE-SE</h2>
            <p>Cadastre-se para ter acesso aos quizzes e testar seus conhecimentos!</p>
                <br><br>
        <div class="formulario">

            <div class="campo">
                <span>Insira o seu Nome Completo:</span>
                <input type="name" id="ipt_nome">
                <div id="div_nome" class="erro"></div>
            </div>

            <div class="campo">
                <span>Insira o seu Email:</span>
                <input type="email" id="ipt_email">
                <div id="div_email" class="erro"></div>
            </div>
            
            <div class="campo">
                <span>Insira a sua Senha:</span>
                <input type="password" id="ipt_senha">
                <div id="div_senha1" class="erro"></div>
            </div>

            <div class="campo">
                <span>Insira novamente a Senha:</span>
                <input type="password" id="ipt_novamenteSenha">
                <div id="div_senha2" class="erro"></div>
            </div>

                <button class="botao" onclick="Cadastro()">CADASTRAR</button>

                <h5>Ja possui conta? <a href="login.html">Faça Login</a></h5>
        </div>
        </div>
    </div>

    <div class="final">
    <div class="container2">
      <h3>Arco e cordas</h3>
      <h4>2026 Arco e Cordas. Todos os direitos reservados</h4>
      <span class="versao">v1.0.0</span>
    </div>
  </div>
</body>
</html>
          

<script>
    function Cadastro() {
        let nome = ipt_nome.value;
        let email = ipt_email.value;
        let senha = ipt_senha.value;
        let senhaNovamente = ipt_novamenteSenha.value;

        div_nome.innerHTML = "";
        div_email.innerHTML = "";
        div_senha1.innerHTML = "";
        div_senha2.innerHTML = "";

        let erro = false;
       
            if(nome == ""){
                div_nome.innerHTML = "Preencha o nome";
                erro = true;
            }
            else if(nome.length < 8){
                div_nome.innerHTML = "Insira o nome completo";
                erro = true;
            }

        

        let indice_arroba = email.indexOf('@');
        let indice_ponto_com = email.indexOf('.com');
        let arroba_antes_ponto_com = indice_arroba < indice_ponto_com;
        let termina_ponto_com = email.endsWith('.com');

            if (email == "") {
                div_email.innerHTML = "Preencha o email";
                erro = true;
            }
            else if(!arroba_antes_ponto_com || !(indice_arroba > -1) || !(indice_ponto_com > -1) || !termina_ponto_com || email.length < 8){
                div_email.innerHTML = "Email Inválido";
                erro = true;
            }



        let temMaiuscula = /[A-Z]/;
        let temMinuscula = /[a-z]/;
        let temNumero = /[0-9]/
        let temEspecial = /[^a-zA-Z0-9]/;

            if (senha == "") {
                div_senha1.innerHTML = "Preencha a senha";
                erro = true;
            }
            else if(senha.length < 6 || !temMaiuscula.test(senha) || !temMinuscula.test(senha) || !temNumero.test(senha) || !temEspecial.test(senha)){
                div_senha1.innerHTML = "A senha deve ter no mínimo 6 caracteres, contendo letra maiúscula, minúscula, numero e caracter especial ";
                erro = true;
            }


            if (senhaNovamente == "") {
                div_senha2.innerHTML = "Preencha a senha";
                erro = true;
            }

            else if(senhaNovamente != senha){
                div_senha2.innerHTML = "As senhas não coincidem";
                erro = true;
            }
        
            
        if(erro){
            return false;
        }
        
        alert("Cadastro realizado com sucesso! Bem vindo(a) ao Arco e Cordas!")
            location.href = "login.html";
    }
</script>
