            <h2>LOGIN</h2>
            <p>Faça o login para ter acesso aos Quizzes e testar seus conhecimentos!</p>
            <br><br>
            <div class="formulario">
            <div class="campo">
                <span>Email</span>
                <input id="email_input" type="text">
                <div id="email_errado" class="erro"></div>
            </div>
            <div class="campo">
                <span>Senha</span>
                <input id="senha_input" type="password">
                <div id="senha_errada" class="erro"></div>
            </div>

            <button class="botao" onclick="entrar()">ENTRAR</button>

<script>
    function entrar() {

        let email = email_input.value;
        let senha = senha_input.value;

        let senhaTeste = 'Lola123*';
        let emailTeste = 'paola.jesus@sptech.school';

        let erro = false;

        email_errado.innerHTML = "";
        senha_errada.innerHTML = "";

        if (email == "" || senha == "") {
            if (email == "") {
                email_errado.innerHTML = "Preencha o email";
            }
            if (senha == "") {
                senha_errada.innerHTML = "Preencha a senha";
            }
            erro = true;
        }


        if (email != emailTeste){
            email_errado.innerHTML = "Email incorreto";
            erro = true;
        }

        else if (senha != senhaTeste) {
            senha_errada.innerHTML = "Senha incorreta";
            erro = true;
        }


        if (erro) {
            return false;
        }

        location.href = "dashboard.html";
}
</script>
