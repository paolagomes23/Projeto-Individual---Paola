<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Violino | Arco e Cordas</title>

    <link rel="stylesheet" href="css/cadastro.css">

</head>

<body>

    <div class="containerSuperior">
    <ul class="indices">
        <a href="index.html" class="botao1"><img src="assets/imgs/sair.png"> EXIT</a> 
    </ul> 
    </div>
    
    <div class="container">
        <div class="cadastro"><img src="assets/imgs/logo.png" alt="">
            <h2>CADASTRE-SE</h2>
            <p>Cadastre-se para ter acesso aos quizzes e testar seus conhecimentos!</p>
                <br><br>
        <div class="formulario">

            <div class="campo">
                <span>Insira o seu Nome Completo:</span>
                <input type="text" id="ipt_nome">
                <div id="div_nome" class="erro"></div>
            </div>

            <div class="campo">
                <span>Insira o seu Email:</span>
                <input type="email" id="ipt_email">
                <div id="div_email" class="erro"></div>
            </div>
            
            <div class="campo">
                <span>Insira a sua Senha:</span>
                <input type="password" id="ipt_senha">
                <div id="div_senha1" class="erro"></div>
            </div>

            <div class="campo">
                <span>Insira novamente a Senha:</span>
                <input type="password" id="ipt_novamenteSenha">
                <div id="div_senha2" class="erro"></div>
            </div>

                <button class="botao" onclick="cadastrar()">CADASTRAR</button>

                <h5>Ja possui conta? <a href="login.html">Faça Login</a></h5>
        </div>
        </div>
    </div>

    <div class="final">
    <div class="container2">
      <h3>Arco e cordas</h3>
      <h4>2026 Arco e Cordas. Todos os direitos reservados</h4>
      <span class="versao">v1.0.0</span>
    </div>
  </div>
</body>
</html>
          

<script>


    function cadastrar() {
        let nome = ipt_nome.value;
        let email = ipt_email.value;
        let senha = ipt_senha.value;
        let senhaNovamente = ipt_novamenteSenha.value;

        let erros = [div_nome, div_email, div_senha1, div_senha2];

            for (let i = 0; i < erros.length; i++) {
                erros[i].innerHTML = "";
            }

        let erro = false;
       

            if(nome == ""){
                div_nome.innerHTML = "Preencha o nome";
                erro = true;
            }
            else if(nome.length < 8){
                div_nome.innerHTML = "Insira o nome completo";
                erro = true;
            }

        
        let indice_arroba = email.indexOf('@');
        let indice_ponto = email.lastIndexOf('.');
        let arroba_antes_ponto = indice_arroba < indice_ponto;


            if (email == "") {
                div_email.innerHTML = "Preencha o email";
                erro = true;
            }
            else if(!arroba_antes_ponto || !(indice_arroba > -1) || !(indice_ponto > -1) || email.length < 8){
                div_email.innerHTML = "Email Inválido";
                erro = true;
            }


        let temMaiuscula = /[A-Z]/;
        let temMinuscula = /[a-z]/;
        let temNumero = /[0-9]/
        let temCaracter = /[^a-zA-Z0-9]/;


            if (senha == "") {
                div_senha1.innerHTML = "Preencha a senha";
                erro = true;
            }
            else if(senha.length < 6 || !temMaiuscula.test(senha) || !temMinuscula.test(senha) || !temNumero.test(senha) || !temCaracter.test(senha)){
                div_senha1.innerHTML = "A senha deve ter no mínimo 6 caracteres, contendo letra maiúscula, minúscula, numero e caracter especial ";
                erro = true;
            }


            if (senhaNovamente == "") {
                div_senha2.innerHTML = "Preencha a senha";
                erro = true;
            }

            else if(senhaNovamente != senha){
                div_senha2.innerHTML = "As senhas não coincidem";
                erro = true;
            }
        
            
        if(erro){
            return false;
        }
        
    
      fetch("/usuarios/cadastrar", {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
      },
      body: JSON.stringify({
        // crie um atributo que recebe o valor recuperado aqui
        // Agora vá para o arquivo routes/usuario.js
        nomeServer: nome,
        emailServer: email,
        senhaServer: senha
      }),
    })
      .then(function (resposta) {
        console.log("resposta: ", resposta);

        if (resposta.ok) {
          
          alert("Cadastro realizado com sucesso!")
    

          setTimeout(() => {
            window.location = "login.html";
          }, "1000");

          limparFormulario();
        //   finalizarAguardar();
        } else {
          alert("Houve um erro ao tentar realizar o cadastro!");
        }
      })
      .catch(function (resposta) {
        console.log(`#ERRO: ${resposta}`);
        // finalizarAguardar();
      });
  
  }

  
</script>
