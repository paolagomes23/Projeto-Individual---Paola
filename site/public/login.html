<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Violino | Arco e Cordas</title>

    <link rel="stylesheet" href="css/login.css">
</head>

<body>

    <div class="containerSuperior">
    <ul class="indices">
        <a href="index.html" class="botao1"><img src="assets/imgs/sair.png"> EXIT</a> 
    </ul>
  </div>


    <div class="container">
        <div class="login"><img src="assets/imgs/logo.png" alt="">
            <h2>LOGIN</h2>
            <p>Faça o login para ter acesso aos Quizzes e testar seus conhecimentos!</p>
            <br><br>
            <div class="formulario">
            <div class="campo">
                <span>Email</span>
                <input id="email_input" type="email">
                <div id="email_errado" class="erro"></div>
            </div>
            <div class="campo">
                <span>Senha</span>
                <input id="senha_input" type="password">
                <div id="senha_errada" class="erro"></div>
            </div>

            <button class="botao" onclick="entrar()">ENTRAR</button>

            <h5 class="cadastre">Não possui uma conta? <a href="cadastro.html">Cadastre-se</a></h5>
            </div>
        </div>
    </div>

    <div class="final">
    <div class="container2">
      <h3>Arco e cordas</h3>
      <h4>2026 Arco e Cordas. Todos os direitos reservados</h4>
      <span class="versao">v1.0.0</span>
    </div>
  </div>
</body>

</html>

<script>
    function entrar() {

        let email = email_input.value;
        let senha = senha_input.value;

        let erros = [email_errado, senha_errada];
        
            for(let i = 0; i < erros.length; i++){
                erros[i].innerHTML = "";
            }

        
        let erro = false;


        if (email == "" || senha == "") {
            if (email == "") {
                email_errado.innerHTML = "Preencha o email";
            }
            if (senha == "") {
                senha_errada.innerHTML = "Preencha a senha";
            }
            erro = true;
        }

        
        if (erro) {
            return false;
        }


        fetch("/usuarios/autenticar", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                emailServer: email,
                senhaServer: senha
            })
        }).then(function (resposta) {
            console.log("ESTOU NO THEN DO entrar()!")

            if (resposta.ok) {
                console.log(resposta);

                resposta.json().then(json => {
                    console.log(json);
                    console.log(JSON.stringify(json));
                    sessionStorage.EMAIL_USUARIO = json.email;
                    sessionStorage.NOME_USUARIO = json.nome;
                    sessionStorage.ID_USUARIO = json.id


                    alert("Login realizado com sucesso! Bem vindo(a) ao Arco e Cordas!");

                    setTimeout(function () {
                        window.location = "dashboard/dash-inicio.html";
                    }, 1000); // apenas para exibir o loading

                });

            } else {

                alert("Houve um erro ao tentar realizar o login!");

                resposta.text().then(texto => {
                    console.error(texto);
                });
            }

        }).catch(function (erro) {
            console.log(erro);
        })
}
</script>
